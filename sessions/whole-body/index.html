@font-face{font-family:DM;src:url('../../fonts/dm-sans-300.woff2') format('woff2');font-display:swap}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:#110e1f;color:#f8f3ee;font-family:DM,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #e9d9ca;outline-offset:5px}
.room{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 53% 40%,#39233e 0,#21162f 48%,#0a0b1d 100%)}#flow{position:absolute;inset:0;width:100%;height:100%;filter:saturate(1.08)}.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0907169c,transparent 32%,transparent 48%,#08071847 69%,#070714e8)}.dim-veil{position:absolute;inset:0;z-index:1;pointer-events:none;background:#050916;opacity:0;transition:opacity 1.4s ease}.room.dimmed .dim-veil{opacity:.82}
.chrome{position:absolute;inset:0;z-index:3;pointer-events:none;transition:opacity .8s ease,transform .8s ease}.chrome>*{pointer-events:auto}.room.idle .chrome{opacity:0;transform:translateY(7px)}.room.idle .chrome>*{pointer-events:none}.room:has(:focus-visible) .chrome{opacity:1;transform:none}.room:has(:focus-visible) .chrome>*{pointer-events:auto}
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:2rem;padding:clamp(22px,4vw,48px) clamp(25px,5vw,76px)}.identity{display:flex;align-items:center;gap:clamp(18px,2.4vw,36px);min-width:0}.mark{font-size:11px;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap;text-decoration:none;color:inherit}.back{font-size:12px;letter-spacing:.025em;color:#f8f3eeb8;text-decoration:none;white-space:nowrap;transition:color .25s}.back:hover,.text-control:hover{color:#fff}.back::before{content:'←';display:inline-block;margin-right:10px;font-size:16px;vertical-align:-1px}.utilities{display:flex;align-items:center;gap:clamp(14px,2vw,28px);flex-wrap:wrap;justify-content:flex-end}.text-control{border:0;background:none;padding:8px 0;color:#f8f3eec9;font-size:12px;letter-spacing:.04em;white-space:nowrap;transition:color .25s}.text-control[aria-pressed="true"]{color:#fff}
.caption{position:absolute;top:42%;left:50%;width:min(760px,calc(100% - 52px));margin:0;transform:translate(-50%,-50%);text-align:center;font-size:clamp(22px,3.2vw,43px);line-height:1.35;letter-spacing:-.025em;text-shadow:0 3px 25px #030712b5;opacity:0;pointer-events:none;z-index:2}
.bottom{position:absolute;left:clamp(25px,5vw,76px);right:clamp(25px,5vw,76px);bottom:max(clamp(27px,5vw,65px),env(safe-area-inset-bottom))}.edition{display:flex;align-items:center;gap:12px;margin:0 0 clamp(17px,2vw,27px);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#f8f3eeb0}.edition::before{content:'';width:14px;height:1px;background:#f8f3eeb0}.player-heading{display:flex;align-items:end;justify-content:space-between;gap:20px}h1{margin:0;font-weight:300;font-size:clamp(42px,6.1vw,94px);letter-spacing:-.063em;line-height:.96}.subtitle{margin:13px 0 0;color:#f8f3eed0;font-size:clamp(14px,1.35vw,18px);letter-spacing:-.01em}.duration{margin:0 0 5px;color:#f8f3eeb0;font-size:11px;letter-spacing:.13em;white-space:nowrap;text-transform:uppercase}
.transport{display:flex;align-items:center;gap:clamp(18px,3vw,42px);margin-top:clamp(30px,4.3vw,60px)}.play{position:relative;display:grid;place-items:center;flex:none;width:68px;height:68px;padding:0;border:0;background:none;color:#f8f3ee;transition:transform .3s ease}.play:hover{transform:scale(1.08)}.orbit{position:absolute;inset:2px;width:64px;height:64px;overflow:visible}.orbit circle,.orbit ellipse{fill:none;stroke:currentColor;stroke-width:1.1;opacity:.75}.orbit ellipse:first-of-type{transform:rotate(-28deg);transform-origin:32px 32px;opacity:.45}.orbit ellipse:last-of-type{transform:rotate(32deg);transform-origin:32px 32px;opacity:.35}.play-icon{position:relative;z-index:1;display:block;width:0;height:0;margin-left:3px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid currentColor}.playing .play-icon{width:11px;height:13px;margin-left:0;border:0;border-left:2px solid currentColor;border-right:2px solid currentColor}
.timeline{display:flex;align-items:center;gap:18px;min-width:0;flex:1}.time{font-size:11px;letter-spacing:.08em;color:#f8f3eed1;font-variant-numeric:tabular-nums;white-space:nowrap}.seek{--progress:0%;width:100%;min-width:0;flex:1;height:36px;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;touch-action:none}.seek::-webkit-slider-runnable-track{height:1px;background:linear-gradient(to right,#f8f3ee 0 var(--progress),#f8f3ee69 var(--progress) 100%)}.seek::-moz-range-track{height:1px;background:#f8f3ee69}.seek::-moz-range-progress{height:1px;background:#f8f3ee}.seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border:1px solid #f8f3ee;border-radius:50%;background:#f8f3ee;margin-top:-5.5px;box-shadow:0 0 0 7px #f8f3ee15}.seek::-moz-range-thumb{width:12px;height:12px;border:1px solid #f8f3ee;border-radius:50%;background:#f8f3ee;box-shadow:0 0 0 7px #f8f3ee15}.status{min-height:1.2em;margin:12px 0 0 108px;font-size:11px;letter-spacing:.04em;color:#f8f3eeb0}audio{display:none}
.transcript{width:min(670px,calc(100% - 32px));max-height:min(760px,calc(100dvh - 32px));border:1px solid #ffffff38;border-radius:14px;padding:0;background:#13182b;color:#f8f3ee;box-shadow:0 20px 80px #0009}.transcript::backdrop{background:#020611b5;backdrop-filter:blur(8px)}.transcript-header{position:sticky;top:0;display:flex;align-items:start;justify-content:space-between;gap:24px;padding:28px 30px 20px;background:#13182b;border-bottom:1px solid #ffffff22}.transcript h2{font-size:30px;font-weight:300;letter-spacing:-.04em;margin:5px 0 0}.transcript .eyebrow{margin:0;color:#f8f3eea8;font-size:10px;letter-spacing:.18em;text-transform:uppercase}.close{border:1px solid #ffffff6e;border-radius:99px;background:transparent;padding:8px 16px;font-size:12px}.transcript-body{max-height:calc(min(760px,100dvh - 32px) - 105px);overflow:auto;padding:12px 30px 28px}.transcript-body p{font-size:16px;line-height:1.65;color:#f8f3eed9}.cue-line{display:grid;grid-template-columns:48px 1fr;gap:15px;align-items:baseline;margin:20px 0}.cue-line button{border:0;background:none;padding:6px 0;color:#d4c7e1b3;text-align:left;font-size:12px;font-variant-numeric:tabular-nums}.cue-line button:hover{text-decoration:underline}.cue-line p{margin:0}.room.idle:has(.transcript[open]) .chrome{opacity:1;transform:none}
@media(max-width:700px){.top{align-items:start;gap:8px}.identity{display:block;flex:none}.mark{display:block;margin-bottom:12px}.utilities{gap:0 12px;max-width:205px;min-width:0}.text-control{font-size:11px}.caption{top:39%;font-size:clamp(21px,6vw,29px)}.duration{display:none}.transport{gap:18px}.play{width:56px;height:56px}.orbit{width:52px;height:52px}.orbit circle{r:23px;cx:26px;cy:26px}.orbit ellipse{rx:23px;ry:14px;cx:26px;cy:26px}.orbit ellipse:first-of-type,.orbit ellipse:last-of-type{transform-origin:26px 26px}.timeline{gap:9px}.time{font-size:10px}.status{margin-left:74px}.transcript-header{padding:22px}.transcript-body{padding:10px 22px 24px}}
@media(max-height:600px){.top{padding-top:18px}.bottom{bottom:max(20px,env(safe-area-inset-bottom))}.edition{margin-bottom:10px}.transport{margin-top:20px}.caption{top:38%}}@media(prefers-reduced-motion:reduce){.chrome,.play,.dim-veil{transition:none}}
</style>

<body>
<main class="room" id="room">
<canvas id="flow" aria-label="Slowly breathing translucent organic contours in plum, amber and indigo" role="img"></canvas><div class="veil" aria-hidden="true"></div><div class="dim-veil" aria-hidden="true"></div><p class="caption" id="caption" aria-hidden="true"></p>
<div class="chrome">
<header class="top"><div class="identity"><a class="mark" href="../../index.html">Superthoughts</a><a class="back" href="../../session.html?session=whole-body">Back</a></div><div class="utilities"><button class="text-control" data-analytics-settings type="button">Privacy choices</button><button class="text-control" id="words-toggle" type="button" aria-pressed="false" aria-controls="caption">Show words</button><button class="text-control" id="transcript-toggle" type="button" aria-haspopup="dialog" aria-controls="transcript">Transcript</button><button class="text-control" id="motion" type="button" aria-pressed="false">Pause motion</button><button class="text-control" id="dim" type="button" aria-pressed="false">Dim light</button><button class="text-control" id="full" type="button">Full screen</button></div></header>
<section class="bottom" aria-label="Audio player"><p class="edition">An immersive practice</p><div class="player-heading"><div><h1>Whole-body relaxation</h1><p class="subtitle">A spacious practice to soften from head to toe.</p></div><p class="duration">7 min 30 sec practice</p></div><div class="transport"><button class="play" id="play" type="button" aria-label="Play audio"><svg class="orbit" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29"/><ellipse cx="32" cy="32" rx="29" ry="18"/><ellipse cx="32" cy="32" rx="29" ry="18"/></svg><span class="play-icon"></span></button><div class="timeline"><span class="time" id="elapsed">0:00</span><input class="seek" id="seek" type="range" min="0" max="450" value="0" step="0.1" aria-label="Seek through audio"><span class="time" id="total">7:30</span></div></div><p class="status" id="status" role="status" aria-live="polite"></p></section>
</div>
<audio id="pilot-audio" preload="metadata" src="../../audio/whole-body-v10.mp3"></audio>
<dialog class="transcript" id="transcript" aria-labelledby="transcript-heading"><div class="transcript-header"><div><p class="eyebrow">Session transcript</p><h2 id="transcript-heading">Whole-body relaxation</h2></div><button class="close" id="close-transcript" type="button">Close</button></div><div class="transcript-body" id="transcript-body"><p>Loading transcript…</p></div></dialog>
</main>
<script src="flow-field.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const room=$('room'), audio=$('pilot-audio'), caption=$('caption'), play=$('play'), seek=$('seek'), elapsed=$('elapsed'), total=$('total'), status=$('status');
  const wordsToggle=$('words-toggle'), transcriptToggle=$('transcript-toggle'), transcript=$('transcript'), transcriptBody=$('transcript-body');
  const motion=$('motion'), dim=$('dim'), full=$('full'), motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
  let showWords=false, cues=[], hideTimer=0, captionFrame=0, pausedMotion=motionPreference.matches, seeking=false;
  const formatTime=t=>Number.isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00';
  function reveal(){clearTimeout(hideTimer);room.classList.remove('idle');if(!audio.paused&&!transcript.open)hideTimer=setTimeout(()=>{if(!audio.paused&&!room.querySelector(':focus-visible'))room.classList.add('idle')},4200)}
  function updateTime(){const duration=Number.isFinite(audio.duration)?audio.duration:450;if(!seeking)seek.value=audio.currentTime;seek.max=duration;seek.style.setProperty('--progress',`${Math.min(100,100*Number(seek.value)/duration)}%`);elapsed.textContent=formatTime(audio.currentTime);total.textContent=formatTime(duration);if('mediaSession' in navigator&&navigator.mediaSession.setPositionState&&Number.isFinite(audio.duration)){try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:audio.currentTime})}catch{}}}
  function stopCaption(){cancelAnimationFrame(captionFrame);captionFrame=0;caption.style.opacity=0}
  function drawCaption(){cancelAnimationFrame(captionFrame);captionFrame=0;if(audio.paused||!showWords||document.hidden){caption.style.opacity=0;return}const t=audio.currentTime,i=cues.findIndex((c,n)=>t>=c.start-.8&&t<Math.min(c.end+1.8,cues[n+1]?.start-.8??Infinity)),c=cues[i];let opacity=0;if(c){const end=Math.min(c.end+1.8,cues[i+1]?.start-.8??Infinity),smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};opacity=Math.min(smooth((t-c.start+.8)/1.6),smooth((end-t)/Math.max(.1,Math.min(1.6,end-c.end))));caption.textContent=c.text}caption.style.opacity=opacity*.88;captionFrame=requestAnimationFrame(drawCaption)}
  function updatePlayback(){const playing=!audio.paused;room.classList.toggle('playing',playing);play.setAttribute('aria-label',playing?'Pause audio':'Play audio');window.setFlowPlaying?.(playing);if('mediaSession' in navigator)navigator.mediaSession.playbackState=playing?'playing':'paused';if(playing){status.textContent='';reveal();drawCaption()}else{reveal();stopCaption()}}
  async function playAudio(){try{await audio.play()}catch{status.textContent='Audio could not play. Please try again.';reveal()}}
  wordsToggle.addEventListener('click',()=>{showWords=!showWords;wordsToggle.setAttribute('aria-pressed',String(showWords));wordsToggle.textContent=showWords?'Hide words':'Show words';if(showWords)drawCaption();else stopCaption();reveal()});
  play.addEventListener('click',()=>audio.paused?playAudio():audio.pause());
  audio.addEventListener('play',updatePlayback);audio.addEventListener('pause',updatePlayback);audio.addEventListener('timeupdate',updateTime);audio.addEventListener('loadedmetadata',updateTime);audio.addEventListener('durationchange',updateTime);
  audio.addEventListener('ended',()=>{audio.currentTime=0;updateTime();status.textContent='Practice complete.';reveal()});audio.addEventListener('error',()=>{status.textContent='Audio could not load. Please try again later.';reveal()});
  seek.addEventListener('pointerdown',()=>{seeking=true;reveal()});seek.addEventListener('pointerup',()=>{seeking=false});seek.addEventListener('pointercancel',()=>{seeking=false;updateTime()});seek.addEventListener('change',()=>{audio.currentTime=Number(seek.value);seeking=false;updateTime();drawCaption();reveal()});seek.addEventListener('input',()=>{seek.style.setProperty('--progress',`${Math.min(100,100*Number(seek.value)/Number(seek.max))}%`);elapsed.textContent=formatTime(Number(seek.value));reveal()});
  function updateMotion(){window.setFlowPaused?.(pausedMotion);motion.textContent=pausedMotion?'Resume motion':'Pause motion';motion.setAttribute('aria-pressed',String(pausedMotion))}motion.addEventListener('click',()=>{pausedMotion=!pausedMotion;updateMotion();reveal()});motionPreference.addEventListener('change',event=>{pausedMotion=event.matches;updateMotion()});updateMotion();
  dim.addEventListener('click',()=>{const value=room.classList.toggle('dimmed');window.setFlowDim?.(value);dim.setAttribute('aria-pressed',String(value));dim.textContent=value?'Restore light':'Dim light';reveal()});
  full.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await room.requestFullscreen()}catch{status.textContent='Full screen is unavailable in this browser.';reveal()}});document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'Exit full screen':'Full screen';reveal()});
  function renderTranscript(){transcriptBody.replaceChildren();if(!cues.length){const p=document.createElement('p');p.textContent='The transcript is unavailable right now.';transcriptBody.append(p);return}for(const cue of cues){const line=document.createElement('div'),time=document.createElement('button'),p=document.createElement('p');line.className='cue-line';time.type='button';time.textContent=formatTime(cue.start);time.setAttribute('aria-label',`Go to ${formatTime(cue.start)}`);time.addEventListener('click',()=>{audio.currentTime=cue.start;updateTime();drawCaption()});p.textContent=cue.text;line.append(time,p);transcriptBody.append(line)}}
  transcriptToggle.addEventListener('click',()=>{transcript.showModal();reveal();$('close-transcript').focus()});$('close-transcript').addEventListener('click',()=>transcript.close());transcript.addEventListener('click',event=>{if(event.target===transcript)transcript.close()});transcript.addEventListener('close',()=>{transcriptToggle.focus({preventScroll:true});reveal()});
  room.addEventListener('pointermove',reveal);room.addEventListener('pointerdown',reveal);room.addEventListener('touchstart',reveal,{passive:true});document.addEventListener('keydown',reveal);room.addEventListener('focusin',reveal);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCaption();else if(!audio.paused)drawCaption()});
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:'Whole-body relaxation',artist:'Superthoughts',album:'Immersive practices',artwork:[{src:new URL('../../images/art/whole-body.jpg',location.href).href,sizes:'512x512',type:'image/jpeg'}]})}catch{}const handlers={play:playAudio,pause:()=>audio.pause(),seekbackward:event=>{audio.currentTime=Math.max(0,audio.currentTime-(event.seekOffset||10))},seekforward:event=>{audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+(event.seekOffset||10))},seekto:event=>{if(Number.isFinite(event.seekTime))audio.currentTime=event.seekTime}};for(const [action,handler] of Object.entries(handlers)){try{navigator.mediaSession.setActionHandler(action,handler)}catch{}}}
  fetch('../../audio/whole-body-v10-cues.json').then(response=>response.ok?response.json():Promise.reject()).then(data=>{cues=(Array.isArray(data)?data:data.cues||[]).filter(c=>Number.isFinite(c.start)&&Number.isFinite(c.end)&&typeof c.text==='string').sort((a,b)=>a.start-b.start);renderTranscript();if(showWords)drawCaption()}).catch(renderTranscript);
  updateTime();
})();
</script>
<script src="../../pilot-catalog.js"></script><script>window.STCatalog=window.STCatalog.map(s=>({...s,src:"/"+s.src,cues:s.cues?"/"+s.cues:null}));</script><script type="module" src="../../pilot-analytics.js"></script></body>
