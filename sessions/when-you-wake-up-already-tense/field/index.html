<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>When You Wake Up Already Tense: morning field</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #120d0a; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<script>
// When You Wake Up Already Tense: a tall window of early light falls across a dim room, and low in the frame
// one small ember breathes, the warmth in the chest the session keeps returning to.
// ?time=seconds pins the clock for a still. The ember follows a slow breath (about 5 s in, 7 s out).
const q = new URLSearchParams(location.search);
const PIN = q.has('time') ? parseFloat(q.get('time')) : null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.getElementById('field');
const ctx = cv.getContext('2d', { alpha: false });
const buf = document.createElement('canvas'); buf.width = 120; buf.height = 200;
const b = buf.getContext('2d');
function breath(t) { const p = (t % 12) / 12; return p < 5 / 12 ? Math.sin(p * 12 / 5 * Math.PI / 2) : Math.cos((p - 5 / 12) * 12 / 7 * Math.PI / 2); }
function draw(t) {
  const W = buf.width, H = buf.height;
  b.globalCompositeOperation = 'source-over';
  b.fillStyle = '#120d0a'; b.fillRect(0, 0, W, H);
  b.globalCompositeOperation = 'lighter';
  // The window: a tall pale-gold column, slightly slanted, its light widening slowly as the morning comes up.
  const open = .5 + .5 * Math.sin(t * .01);
  const wx = W * (.66 + .02 * Math.sin(t * .006));
  for (let i = 0; i < 3; i++) {
    const w = W * (.10 + .05 * i + .03 * open), a = [.34, .18, .10][i];
    const g = b.createLinearGradient(wx - w, 0, wx + w, 0);
    g.addColorStop(0, 'rgba(236,196,128,0)'); g.addColorStop(.5, `rgba(236,196,128,${a})`); g.addColorStop(1, 'rgba(236,196,128,0)');
    b.save(); b.translate(wx, H * .5); b.transform(1, 0, -.18, 1, 0, 0); b.translate(-wx, -H * .5);
    b.fillStyle = g; b.fillRect(wx - w, -H * .1, w * 2, H * 1.2); b.restore();
  }
  b.globalCompositeOperation = 'source-over';
  const floor = b.createLinearGradient(0, H * .55, 0, H);
  floor.addColorStop(0, 'rgba(18,13,10,0)'); floor.addColorStop(1, 'rgba(18,13,10,.7)');
  b.fillStyle = floor; b.fillRect(0, H * .55, W, H * .45);
  b.globalCompositeOperation = 'lighter';
  // Where the window light lands: a soft pool on the sheets.
  const pool = b.createRadialGradient(W * .56, H * .78, 0, W * .56, H * .78, W * .6);
  pool.addColorStop(0, `rgba(214,150,92,${.22 + .06 * open})`); pool.addColorStop(1, 'rgba(214,150,92,0)');
  b.fillStyle = pool; b.fillRect(0, 0, W, H);
  // Cool shade in the far corner of the room.
  const shade = b.createRadialGradient(W * .12, H * .3, 0, W * .12, H * .3, W * .7);
  shade.addColorStop(0, 'rgba(46,62,66,.40)'); shade.addColorStop(1, 'rgba(46,62,66,0)');
  b.fillStyle = shade; b.fillRect(0, 0, W, H);
  // The ember: small, low, breathing.
  const k = breath(t), ex = W * .32, ey = H * .70, er = W * (.10 + .05 * k);
  const em = b.createRadialGradient(ex, ey, 0, ex, ey, er * 2.4);
  em.addColorStop(0, `rgba(255,150,80,${.55 + .25 * k})`); em.addColorStop(.35, `rgba(222,92,48,${.30 + .15 * k})`); em.addColorStop(1, 'rgba(160,50,30,0)');
  b.fillStyle = em; b.fillRect(0, 0, W, H);
  // Ink from the top so the words above stay readable.
  b.globalCompositeOperation = 'source-over';
  const top = b.createLinearGradient(0, 0, 0, H * .5);
  top.addColorStop(0, 'rgba(18,13,10,.82)'); top.addColorStop(1, 'rgba(18,13,10,0)');
  b.fillStyle = top; b.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.filter = `blur(${Math.round(cv.width / 70)}px)`;
  ctx.drawImage(buf, -cv.width * .05, -cv.height * .05, cv.width * 1.1, cv.height * 1.1);
  ctx.filter = 'none';
  ctx.globalAlpha = .07; ctx.fillStyle = grain; ctx.fillRect(0, 0, cv.width, cv.height); ctx.globalAlpha = 1;
}
const g0 = document.createElement('canvas'); g0.width = g0.height = 128;
const gx = g0.getContext('2d'); const img = gx.createImageData(128, 128);
for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
gx.putImageData(img, 0, 0);
const grain = ctx.createPattern(g0, 'repeat');
function resize() {
  const pr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * pr); cv.height = Math.round(innerHeight * pr);
  buf.height = Math.round(buf.width * innerHeight / Math.max(innerWidth, 1));
}
addEventListener('resize', resize); resize();
const start = performance.now(); let last = 0;
function frame(now) {
  if (PIN === null && !reduce) requestAnimationFrame(frame);
  if (now - last < 66) return; last = now;
  draw(PIN !== null ? PIN : (now - start) / 1000 + 20);
}
requestAnimationFrame(frame);
if (PIN !== null || reduce) draw(PIN !== null ? PIN : 20);
</script>
</body>
</html>
